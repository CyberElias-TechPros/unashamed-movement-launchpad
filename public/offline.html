<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — The Time Is Now</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1c1917;
        color: #fafaf9;
        font-family: Georgia, 'Times New Roman', serif;
        text-align: center;
        padding: 24px;
      }
      .box { max-width: 480px; }
      h1 { font-size: 2rem; letter-spacing: 0.1em; margin: 0 0 12px; }
      p { color: #a8a29e; line-height: 1.6; font-size: 1.05rem; margin: 0 0 24px; }
      a {
        display: inline-block;
        background: #fbbf24;
        color: #1c1917;
        text-decoration: none;
        font-weight: 700;
        padding: 12px 32px;
        border-radius: 8px;
      }
      .tag { font-size: 0.8rem; letter-spacing: 0.25em; text-transform: uppercase; color: #fbbf24; margin-bottom: 16px; }
      cite { display: block; margin-top: 40px; color: #78716c; font-style: italic; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="tag">The Time Is Now</div>
      <h1>You're Offline</h1>
      <p>
        It looks like your internet connection dropped. Don't worry — your cart and account are
        safe. Reconnect and try again.
      </p>
      <a href="/">Try again</a>
      <cite>“Is your timidity worth someone else's eternity?”</cite>
    </div>
  </body>
</html>
